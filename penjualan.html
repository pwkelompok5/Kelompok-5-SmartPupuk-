<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>SmartPupuk - Marketplace</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Hero Section */
        .hero_area {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .hero_area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(70%);
            transition: transform 0.5s ease;
        }

        .hero_area img:hover {
            transform: scale(1.05);
        }

        .hero_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
        }

        /* Product Cards */
        .product-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            background: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .product-img {
            height: 180px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .badge-terlaris {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #dc3545;
            color: #fff;
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .terjual {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .harga {
            font-size: 18px;
            font-weight: bold;
            color: #198754;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .btn-modern {
            border-radius: 50px;
            font-weight: 500;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .btn-modern:hover {
            background: #157347;
            transform: scale(1.02);
        }

        .btn-dashboard {
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-dashboard:hover {
            background-color: #1b5e20;
        }

        @media (max-width: 575px) {
            .product-img {
                height: 150px;
            }
        }
    </style>
</head>

<body>
    <!-- Hero Section -->
    <div class="hero_area">
        <img src="assets/image/padi.jpg" alt="Lahan Padi">
        <div class="hero_text">
            <h1 class="fw-bold">SmartPupuk Marketplace</h1>
            <p class="fs-5"><i class="fas fa-store"></i> Temukan pupuk terbaik untuk hasil panen maksimal</p>
        </div>
    </div>

    <!-- Section Title -->
    <div class="container mb-4">
        <h3 class="fw-bold text-success">
            <i class="fas fa-store"></i> SmartPupuk Marketplace
        </h3>
    </div>

    <!-- Product Grid -->
    <div class="container">
        <div class="row g-4">

            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="card product-card">
                    <span class="badge-terlaris">Terlaris</span>
                    <img src="assets\image\urea.png" class="card-img-top product-img" alt="Pupuk Urea">
                    <div class="card-body text-center">
                        <h6 class="card-title">Pupuk Urea</h6>
                        <p class="terjual"><i class="fas fa-box"></i> 1.540 Terjual</p>
                        <p class="harga">Rp90.000</p>
                        <a href="detail.html" class="btn btn-success btn-sm w-100 btn-modern">
                            <i class="fas fa-eye"></i> Lihat Produk
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="card product-card">
                    <img src="assets\image\sp36.png" class="card-img-top product-img" alt="Pupuk SP-36">
                    <div class="card-body text-center">
                        <h6 class="card-title">Pupuk SP-36</h6>
                        <p class="terjual"><i class="fas fa-box"></i> 980 Terjual</p>
                        <p class="harga">Rp570.000</p>
                        <a href="detail.html" class="btn btn-success btn-sm w-100 btn-modern">
                            <i class="fas fa-eye"></i> Lihat Produk
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="card product-card">
                    <span class="badge-terlaris">Terlaris</span>
                    <img src="assets\image\kcl.png" class="card-img-top product-img" alt="Pupuk KCL">
                    <div class="card-body text-center">
                        <h6 class="card-title">Pupuk KCL</h6>
                        <p class="terjual"><i class="fas fa-box"></i> 1.210 Terjual</p>
                        <p class="harga">Rp 450.000</p>
                        <a href="detail.html" class="btn btn-success btn-sm w-100 btn-modern">
                            <i class="fas fa-eye"></i> Lihat Produk
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <a href="dashboard.html">
        <button class="btn-dashboard">Kembali ke Dashboard</button>
    </a>
    
</body>
</html>
